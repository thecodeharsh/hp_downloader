services:
  hp-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hp-downloader
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - MAX_FILE_SIZE_MB=250
      - ANALYZE_TIMEOUT_MS=35000
      - DOWNLOAD_TIMEOUT_MS=180000
    tmpfs:
      - /tmp/hp-downloader-temp:size=1G,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
